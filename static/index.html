<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirumala Daily — Devotional Content & Reel Preparation</title>
  
  <!-- Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#eec14b',
              goldContainer: '#c59b27',
              dark: '#0f141c',
              card: '#171c24',
              surface: '#1b2028',
              surfaceHigh: '#252a33',
              ruby: '#7f2830',
              emerald: '#55b289',
              text: '#dee2ee',
              muted: '#9a907c'
            }
          },
          fontFamily: {
            serif: ['Noto Serif', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { overscroll-behavior: none; }
  </style>
</head>
<body class="bg-brand-dark text-brand-text font-sans antialiased min-h-screen flex flex-col">

  <!-- TOP BRAND HEADER -->
  <header class="sticky top-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-brand-surfaceHigh">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Telemetry Tag -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-brand-goldContainer flex items-center justify-center text-brand-dark font-serif text-xl font-bold shadow-lg shadow-brand-gold/10">
          🕉️
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span class="font-serif text-lg text-brand-gold font-semibold tracking-tight">Tirumala Daily</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-brand-ruby text-white font-bold tracking-wider uppercase">OFFICIAL MVP</span>
          </div>
          <span class="text-[11px] text-brand-muted font-mono">Devotional Content Intelligence & Reel Creator</span>
        </div>
      </div>

      <!-- Quick Metrics Header Pill -->
      <div class="hidden md:flex items-center gap-6 px-4 py-1.5 rounded-full bg-brand-card border border-brand-surfaceHigh text-xs font-mono">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-brand-emerald animate-pulse"></span>
          <span class="text-brand-muted">TTD News:</span>
          <span class="text-brand-gold font-bold" id="stat-bulletins">0</span>
        </div>
        <div class="h-3 w-px bg-brand-surfaceHigh"></div>
        <div class="flex items-center gap-2">
          <span class="text-brand-muted">Reels Staged:</span>
          <span class="text-brand-emerald font-bold" id="stat-reels">0</span>
        </div>
        <div class="h-3 w-px bg-brand-surfaceHigh"></div>
        <div class="flex items-center gap-2">
          <span class="text-brand-muted">Media Assets:</span>
          <span class="text-brand-text font-bold" id="stat-media">0</span>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        <button onclick="runPipeline()" id="btn-run-pipeline" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-gold hover:bg-brand-goldContainer text-brand-dark font-bold text-xs transition-all shadow-lg shadow-brand-gold/20 active:scale-95">
          <span class="material-symbols-outlined text-[18px]">bolt</span>
          <span>Run Daily Automation</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TAB STRIP -->
  <div class="bg-brand-card border-b border-brand-surfaceHigh">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 flex items-center gap-2 overflow-x-auto py-2">
      <button onclick="switchTab('bulletins')" id="tab-bulletins" class="nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all bg-brand-goldContainer text-brand-dark">
        <span class="material-symbols-outlined text-[18px]">newspaper</span>
        <span>Today's TTD Bulletins</span>
      </button>
      <button onclick="switchTab('studio')" id="tab-studio" class="nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all text-brand-muted hover:text-brand-text hover:bg-brand-surface">
        <span class="material-symbols-outlined text-[18px]">movie_edit</span>
        <span>Reel Studio (9:16)</span>
      </button>
      <button onclick="switchTab('gallery')" id="tab-gallery" class="nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all text-brand-muted hover:text-brand-text hover:bg-brand-surface">
        <span class="material-symbols-outlined text-[18px]">photo_library</span>
        <span>Posters & Thumbnails</span>
      </button>
      <button onclick="switchTab('status')" id="tab-status" class="nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all text-brand-muted hover:text-brand-text hover:bg-brand-surface">
        <span class="material-symbols-outlined text-[18px]">monitoring</span>
        <span>Pipeline Telemetry</span>
      </button>
    </div>
  </div>

  <!-- MAIN DYNAMIC CONTENT CONTAINER -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 flex-1 w-full" id="view-container">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-brand-surfaceHigh text-brand-text px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-brand-gold/20 font-bold text-xs">
    <span class="material-symbols-outlined text-brand-gold text-[20px]" id="toast-icon">check_circle</span>
    <span id="toast-message">Pipeline execution completed successfully</span>
  </div>

  <!-- CLIENT JAVASCRIPT CONTROLLER -->
  <script>
    let currentTab = 'bulletins';
    let newsData = [];
    let reelsData = [];
    let activeReel = null;
    let reelLang = 'te';

    function showToast(msg, icon = 'check_circle') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');
      if (toast && toastMsg && toastIcon) {
        toastMsg.innerText = msg;
        toastIcon.innerText = icon === 'error' ? 'warning' : icon;
        toast.classList.remove('translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-24', 'opacity-0');
        }, 3200);
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-bulletins').innerText = data.stats.total_news;
          document.getElementById('stat-reels').innerText = data.stats.total_reels;
          document.getElementById('stat-media').innerText = data.stats.total_media;
        }
      } catch (err) {
        console.error('Failed to load status:', err);
      }
    }

    async function loadNews() {
      try {
        const res = await fetch('/api/news');
        const data = await res.json();
        if (data.success) newsData = data.news;
      } catch (err) {
        console.error('Failed to load news:', err);
      }
    }

    async function loadReels() {
      try {
        const res = await fetch('/api/reels');
        const data = await res.json();
        if (data.success) {
          reelsData = data.reels;
          if (reelsData.length > 0 && !activeReel) {
            activeReel = reelsData[0];
          }
        }
      } catch (err) {
        console.error('Failed to load reels:', err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-tab').forEach(b => {
        b.className = 'nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all text-brand-muted hover:text-brand-text hover:bg-brand-surface';
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) {
        activeBtn.className = 'nav-tab px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all bg-brand-goldContainer text-brand-dark';
      }

      renderView();
    }

    async function renderView() {
      const container = document.getElementById('view-container');
      if (!container) return;

      if (currentTab === 'bulletins') {
        renderBulletinsView(container);
      } else if (currentTab === 'studio') {
        renderStudioView(container);
      } else if (currentTab === 'gallery') {
        renderGalleryView(container);
      } else if (currentTab === 'status') {
        renderStatusView(container);
      }
    }

    // 1. TODAY'S BULLETINS VIEW
    function renderBulletinsView(container) {
      container.innerHTML = `
        <div class="flex flex-col gap-6">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h1 class="font-serif text-2xl text-brand-text font-bold">Official TTD News Bulletins</h1>
              <p class="text-xs text-brand-muted">Ingested from news.tirumala.org • SHA-256 Deduplicated & Verified</p>
            </div>
            <button onclick="runPipeline()" class="px-4 py-2 rounded-lg bg-brand-surface border border-brand-surfaceHigh text-brand-gold text-xs font-bold flex items-center gap-2 hover:bg-brand-surfaceHigh">
              <span class="material-symbols-outlined text-[16px]">refresh</span>
              <span>Sync Source Feed</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${newsData.length === 0 ? '<p class="text-brand-muted font-mono text-sm col-span-3">No news bulletins loaded. Click "Sync Source Feed" to fetch official TTD announcements.</p>' : ''}
            ${newsData.map(item => `
              <div class="bg-brand-card rounded-xl p-5 border border-brand-surfaceHigh flex flex-col justify-between gap-4 hover:border-brand-gold/40 transition-all shadow-md">
                <div class="flex flex-col gap-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-brand-ruby/30 text-brand-ruby font-bold uppercase">${item.category}</span>
                    <span class="text-[10px] font-mono text-brand-emerald flex items-center gap-1 font-bold">
                      <span class="material-symbols-outlined text-[12px]">verified</span>
                      VERIFIED
                    </span>
                  </div>
                  <h3 class="font-serif text-base text-brand-text font-bold leading-snug">${item.title}</h3>
                  <p class="text-xs text-brand-muted line-clamp-3 leading-relaxed">${item.summary}</p>
                </div>
                <div class="pt-3 border-t border-brand-surfaceHigh flex items-center justify-between gap-2">
                  <a href="${item.source_url}" target="_blank" class="text-[11px] font-mono text-brand-muted hover:text-brand-gold flex items-center gap-1">
                    <span class="material-symbols-outlined text-[14px]">open_in_new</span>
                    <span>Source</span>
                  </a>
                  <button onclick="selectAndGoToStudio('${item.id}')" class="px-3 py-1.5 rounded-lg bg-brand-gold text-brand-dark text-xs font-bold flex items-center gap-1 hover:bg-brand-goldContainer transition-all">
                    <span class="material-symbols-outlined text-[14px]">movie_edit</span>
                    <span>Reel Package</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 2. REEL STUDIO VIEW (CONNECTED TO 9:16 EMULATOR)
    function renderStudioView(container) {
      if (!activeReel && reelsData.length > 0) activeReel = reelsData[0];

      if (!activeReel) {
        container.innerHTML = `
          <div class="p-12 text-center flex flex-col items-center gap-4 text-brand-muted">
            <span class="material-symbols-outlined text-5xl text-brand-gold">movie_edit</span>
            <h2 class="font-serif text-xl text-brand-text">No Reel Package Selected</h2>
            <p class="text-xs max-w-md">Click "Run Daily Automation" or choose a bulletin from Today's TTD Bulletins to prepare a 9:16 Reel package.</p>
          </div>
        `;
        return;
      }

      const r = activeReel;
      const scriptText = reelLang === 'te' ? r.telugu_script : (reelLang === 'hi' ? r.hindi_script : r.english_script);

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
          
          <!-- LEFT 7 COLS: SCRIPT & METADATA -->
          <div class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- REEL SELECTION HEADER -->
            <div class="bg-brand-card p-5 rounded-xl border border-brand-surfaceHigh flex flex-col gap-3">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <span class="px-2 py-0.5 rounded font-mono text-[10px] bg-brand-goldContainer/20 text-brand-gold font-bold uppercase">${r.category}</span>
                <span class="text-xs font-mono text-brand-emerald flex items-center gap-1 font-bold">
                  <span class="material-symbols-outlined text-[14px]">check_circle</span>
                  READY FOR INSTAGRAM
                </span>
              </div>
              <h2 class="font-serif text-xl text-brand-text font-bold">${r.title}</h2>
              <a href="${r.source_url}" target="_blank" class="text-xs font-mono text-brand-muted hover:text-brand-gold truncate">🔗 ${r.source_url}</a>
            </div>

            <!-- LANGUAGE SWITCHER & TELEPROMPTER SCRIPT -->
            <div class="bg-brand-card p-5 rounded-xl border border-brand-surfaceHigh flex flex-col gap-4">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <h3 class="font-serif text-base text-brand-text font-bold">Multilingual Teleprompter Script</h3>
                <div class="flex items-center bg-brand-surface rounded-lg p-1 border border-brand-surfaceHigh">
                  <button onclick="setReelLang('te')" class="px-3 py-1 rounded text-xs font-bold ${reelLang === 'te' ? 'bg-brand-gold text-brand-dark' : 'text-brand-muted hover:text-brand-text'} transition-all">తెలుగు</button>
                  <button onclick="setReelLang('hi')" class="px-3 py-1 rounded text-xs font-bold ${reelLang === 'hi' ? 'bg-brand-gold text-brand-dark' : 'text-brand-muted hover:text-brand-text'} transition-all">हिन्दी</button>
                  <button onclick="setReelLang('en')" class="px-3 py-1 rounded text-xs font-bold ${reelLang === 'en' ? 'bg-brand-gold text-brand-dark' : 'text-brand-muted hover:text-brand-text'} transition-all">ENGLISH</button>
                </div>
              </div>

              <div class="bg-brand-surface p-4 rounded-lg border border-brand-surfaceHigh">
                <pre class="font-sans text-sm text-brand-text leading-relaxed whitespace-pre-wrap font-medium" id="script-box">${scriptText}</pre>
              </div>

              <div class="flex items-center justify-between pt-2">
                <span class="text-xs font-mono text-brand-muted">Target Duration: 30–40 seconds</span>
                <button onclick="copyScriptText()" class="px-4 py-1.5 rounded-lg bg-brand-surface hover:bg-brand-surfaceHigh text-brand-gold text-xs font-bold flex items-center gap-1 border border-brand-gold/30">
                  <span class="material-symbols-outlined text-[14px]">content_copy</span>
                  <span>Copy Script</span>
                </button>
              </div>
            </div>

            <!-- INSTAGRAM CAPTION & HASHTAG BANK -->
            <div class="bg-brand-card p-5 rounded-xl border border-brand-surfaceHigh flex flex-col gap-3">
              <h3 class="font-serif text-base text-brand-text font-bold">Instagram Description & Hashtags</h3>
              <div class="bg-brand-surface p-3 rounded-lg text-xs text-brand-text leading-relaxed">
                ${r.english_script}
              </div>
            </div>
          </div>

          <!-- RIGHT 5 COLS: 9:16 VERTICAL EMULATOR -->
          <div class="lg:col-span-5 flex flex-col items-center">
            <div class="relative w-full max-w-[340px] aspect-[9/16] bg-brand-dark rounded-2xl overflow-hidden shadow-2xl border-4 border-brand-surfaceHigh flex flex-col justify-between p-4" style="background-image: url('${r.thumb_url || ''}'); background-size: cover; background-position: center;">
              <div class="absolute inset-0 bg-gradient-to-b from-brand-dark/80 via-transparent to-brand-dark/95 pointer-events-none"></div>

              <!-- Top Reel Header -->
              <div class="relative z-10 flex items-center justify-between">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-brand-dark/80 backdrop-blur-md">
                  <span class="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></span>
                  <span class="font-serif text-xs text-brand-gold font-bold">Tirumala Daily</span>
                </div>
                <span class="px-2 py-0.5 rounded bg-brand-dark/80 text-brand-text font-mono text-[10px]">9:16 HD</span>
              </div>

              <!-- Center Play Icon -->
              <div class="relative z-10 my-auto flex flex-col items-center justify-center gap-2 cursor-pointer" onclick="showToast('Reel Teleprompter Audio Synthesized', 'graphic_eq')">
                <div class="w-14 h-14 rounded-full bg-brand-gold text-brand-dark flex items-center justify-center shadow-lg hover:scale-105 transition-all">
                  <span class="material-symbols-outlined text-3xl">play_arrow</span>
                </div>
                <span class="px-3 py-0.5 rounded-full bg-brand-dark/90 font-mono text-[11px] text-brand-gold backdrop-blur-md">00:15 / 00:38s</span>
              </div>

              <!-- Bottom Subtitle Overlay -->
              <div class="relative z-10 bg-brand-card/90 backdrop-blur-md p-3 rounded-xl border border-brand-gold/30">
                <p class="font-serif text-xs text-brand-gold font-bold leading-snug">
                  “తిరుమలలో ఇవాళ్టి అతి ముఖ్యమైన అప్డేట్ ఇదే... భక్తులు తప్పక తెలుసుకోవాల్సిన వివరాలు!”
                </p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function setReelLang(lang) {
      reelLang = lang;
      renderStudioView(document.getElementById('view-container'));
      showToast(`Language switched to ${lang.toUpperCase()}`);
    }

    function copyScriptText() {
      const box = document.getElementById('script-box');
      if (box) {
        navigator.clipboard.writeText(box.innerText).then(() => {
          showToast('Script copied to clipboard!');
        });
      }
    }

    function selectAndGoToStudio(newsId) {
      const found = reelsData.find(r => r.news_id === newsId);
      if (found) {
        activeReel = found;
        switchTab('studio');
      } else {
        showToast('Generating Reel package for selected bulletin...', 'auto_fix_high');
        runPipeline().then(() => switchTab('studio'));
      }
    }

    // 3. POSTERS & THUMBNAILS GALLERY VIEW
    function renderGalleryView(container) {
      container.innerHTML = `
        <div class="flex flex-col gap-6">
          <div>
            <h1 class="font-serif text-2xl text-brand-text font-bold">1080x1920 Poster & Thumbnail Gallery</h1>
            <p class="text-xs text-brand-muted">Automated mobile visual assets generated for Instagram vertical distribution.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            ${reelsData.map(r => `
              <div class="bg-brand-card rounded-xl p-4 border border-brand-surfaceHigh flex flex-col gap-3">
                <div class="relative aspect-[9/16] rounded-lg overflow-hidden bg-brand-surface border border-brand-surfaceHigh">
                  <img src="${r.thumb_url}" class="w-full h-full object-cover" />
                  <span class="absolute top-2 left-2 px-2 py-0.5 rounded font-mono text-[10px] bg-brand-dark/80 text-brand-gold font-bold">1080x1920</span>
                </div>
                <div class="flex flex-col gap-1">
                  <h4 class="font-serif text-sm text-brand-text font-bold truncate">${r.title}</h4>
                  <span class="text-[11px] font-mono text-brand-muted">${r.category}</span>
                </div>
                <div class="flex items-center gap-2 pt-2 border-t border-brand-surfaceHigh">
                  <a href="${r.thumb_url}" download class="flex-1 py-1.5 rounded-lg bg-brand-surface hover:bg-brand-surfaceHigh text-brand-gold text-xs font-bold text-center border border-brand-gold/20">Thumbnail</a>
                  <a href="${r.poster_url}" download class="flex-1 py-1.5 rounded-lg bg-brand-surface hover:bg-brand-surfaceHigh text-brand-text text-xs font-bold text-center border border-brand-surfaceHigh">Poster</a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 4. PIPELINE TELEMETRY STATUS VIEW
    function renderStatusView(container) {
      container.innerHTML = `
        <div class="flex flex-col gap-6 max-w-4xl">
          <div>
            <h1 class="font-serif text-2xl text-brand-text font-bold">Pipeline Telemetry & System Status</h1>
            <p class="text-xs text-brand-muted">Real-time inspection of official TTD source connections, SQLite database, and media status.</p>
          </div>

          <div class="bg-brand-card p-6 rounded-xl border border-brand-surfaceHigh flex flex-col gap-4 font-mono text-xs">
            <div class="flex items-center justify-between py-2 border-b border-brand-surfaceHigh">
              <span class="text-brand-muted">Primary Source URL:</span>
              <a href="https://news.tirumala.org/" target="_blank" class="text-brand-gold font-bold hover:underline">https://news.tirumala.org/</a>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-brand-surfaceHigh">
              <span class="text-brand-muted">SQLite Database:</span>
              <span class="text-brand-emerald font-bold">data/ttd_official_news_database.sqlite</span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-brand-surfaceHigh">
              <span class="text-brand-muted">Deduplication Engine:</span>
              <span class="text-brand-emerald font-bold">SHA-256 Content Hashing (Active)</span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-brand-surfaceHigh">
              <span class="text-brand-muted">Media Rights Policy:</span>
              <span class="text-brand-gold font-bold">Controlled Download (CHECK_REQUIRED)</span>
            </div>
            <div class="flex items-center justify-between py-2">
              <span class="text-brand-muted">AI Multilingual Engine:</span>
              <span class="text-brand-emerald font-bold">Gemini 2.5 Flash / Devotional Fallback Engine</span>
            </div>
          </div>
        </div>
      `;
    }

    // AUTOMATION RUNNER
    async function runPipeline() {
      showToast('Executing automated ingestion & Reel package generation...', 'sync');
      try {
        const res = await fetch('/api/run-automation', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(`Automation complete! ${data.summary.new_articles} new articles processed.`, 'check_circle');
          await loadStatus();
          await loadNews();
          await loadReels();
          renderView();
        } else {
          showToast(`Error: ${data.detail || 'Pipeline failed'}`, 'error');
        }
      } catch (err) {
        showToast(`Execution failed: ${err.message}`, 'error');
      }
    }

    // INITIAL BOOT
    document.addEventListener('DOMContentLoaded', async () => {
      await loadStatus();
      await loadNews();
      await loadReels();
      renderView();
    });
  </script>
</body>
</html>
